# Keeps the MCP server on the same build as the site: whenever the Worker's sources change on main,
# rebuild server/worker.js, run the tests, and deploy it to Cloudflare.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers") and CLOUDFLARE_ACCOUNT_ID.
name: Deploy MCP worker
on:
  push:
    branches: [main]
    paths: ['server/worker.js', 'js/career-engine.js', 'js/mcp-core.js', 'tools/**', 'data/career.json', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:
concurrency:
  group: deploy-worker
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Worker is built from the current sources
        run: node tools/build-worker.mjs --check
      - name: Tests
        run: node --test tests/*.test.mjs
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare secrets are not set, so the Worker was not deployed. See server/README.md."
            exit 0
          fi
          npx --yes wrangler@4 deploy server/worker.js --name parth-mcp --compatibility-date 2026-10-01
